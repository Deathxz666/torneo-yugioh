<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#581c87">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Torneos YGO">
    
    <!-- Meta tags para PWA avanzada -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Torneos YGO">
    <meta name="msapplication-TileColor" content="#581c87">
    <meta name="msapplication-tap-highlight" content="no">
    
    <title>Torneos Yu-Gi-Oh!</title>
    <link rel="manifest" href="/torneo-yugioh/manifest.json" crossorigin="use-credentials">
    
    <!-- Preload de recursos críticos -->
    <link rel="preload" href="https://unpkg.com/react@18/umd/react.production.min.js" as="script">
    <link rel="preload" href="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" as="script">
    <link rel="preload" href="https://unpkg.com/@babel/standalone/babel.min.js" as="script">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box;
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden;
            background: #f8fafc;
            position: fixed;
            width: 100%;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }
        #root {
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Ocultar barras de scroll */
        #root::-webkit-scrollbar {
            display: none;
        }
        
        /* Mejoras para modo standalone completo */
        @media all and (display-mode: standalone) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
            
            #root {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
        
        /* Prevenir zoom en inputs */
        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
        
        .scroll-smooth {
            scroll-behavior: smooth;
        }
        
        .btn-primary {
            background: #2563eb;
            color: white;
            font-weight: 600;
        }
        
        .btn-primary:hover {
            background: #1d4ed8;
        }
        
        .btn-danger {
            background: #dc2626;
            color: white;
            font-weight: 600;
        }
        
        .btn-danger:hover {
            background: #b91c1c;
        }
        
        .btn-success {
            background: #16a34a;
            color: white;
            font-weight: 600;
        }
        
        .btn-success:hover {
            background: #15803d;
        }
        
        /* Pantalla de carga offline */
        .offline-loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f8fafc;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .offline-loader.show {
            display: flex;
        }
        
        .loader-spinner {
            animation: spin 1s linear infinite;
            border: 3px solid #f3f4f6;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Pantalla de carga para offline -->
    <div id="offlineLoader" class="offline-loader">
        <div class="text-center">
            <div class="loader-spinner mx-auto mb-4"></div>
            <p class="text-gray-600 font-medium">Torneos Yu-Gi-Oh!</p>
            <p class="text-gray-500 text-sm mt-2">Cargando...</p>
        </div>
    </div>

    <div id="root"></div>

    <!-- Script de inicialización MEJORADO -->
    <script>
        // Mostrar loader inmediatamente
        document.getElementById('offlineLoader').classList.add('show');
        
        // Función para verificar recursos cargados
        function checkResourcesLoaded() {
            const resources = [
                window.React,
                window.ReactDOM,
                window.Babel
            ];
            
            return resources.every(resource => resource !== undefined);
        }
        
        // Intentar cargar desde cache primero
        function initializeApp() {
            if (checkResourcesLoaded()) {
                document.getElementById('offlineLoader').classList.remove('show');
                console.log('✅ Aplicación cargada desde cache');
            } else {
                setTimeout(() => {
                    if (checkResourcesLoaded()) {
                        document.getElementById('offlineLoader').classList.remove('show');
                        console.log('✅ Aplicación cargada después de reintento');
                    } else {
                        loadFallbackResources();
                    }
                }, 1000);
            }
        }
        
        // Fallback para cargar recursos dinámicamente
        function loadFallbackResources() {
            console.log('🔄 Cargando recursos de forma dinámica...');
            document.getElementById('offlineLoader').classList.remove('show');
            console.log('✅ Aplicación inicializada con fallback');
        }
        
        // Service Worker MEJORADO para offline completo
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(registration) {
                        console.log('✅ ServiceWorker registrado correctamente:', registration.scope);
                        
                        if (window.matchMedia('(display-mode: standalone)').matches) {
                            console.log('📱 Aplicación ejecutándose en modo standalone');
                            document.title = 'Torneos YGO';
                        }
                        
                        setTimeout(initializeApp, 500);
                    })
                    .catch(function(error) {
                        console.log('❌ Error en ServiceWorker:', error);
                        setTimeout(initializeApp, 500);
                    });
            });
        } else {
            setTimeout(initializeApp, 500);
        }
        
        // Prevenir comportamientos no deseados
        document.addEventListener('touchmove', function(e) {
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // Prevenir gestos de zoom
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        document.addEventListener('gesturechange', function(e) {
            e.preventDefault();
        });
        
        document.addEventListener('gestureend', function(e) {
            e.preventDefault();
        });
        
        // Manejar estado online/offline
        window.addEventListener('online', function() {
            console.log('📶 Aplicación conectada');
        });
        
        window.addEventListener('offline', function() {
            console.log('📵 Aplicación funcionando offline');
        });
        
        // Prevenir que se muestre la barra de URL
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 1);
            }, 0);
            
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
        });
        
        // Detectar y prevenir la barra de dirección en iOS
        if (/(iPhone|iPad|iPod)/i.test(navigator.userAgent)) {
            document.addEventListener('touchstart', function() {
                setTimeout(function() {
                    window.scrollTo(0, 0);
                }, 100);
            });
        }
    </script>

    <!-- CÓDIGO REACT COMPLETO -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Plus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
            </svg>
        );

        const X = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
            </svg>
        );

        const ArrowLeft = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
        );

        function TorneosYugioh() {
            const [tournaments, setTournaments] = useState([]);
            const [activeTournamentId, setActiveTournamentId] = useState(null);
            const [view, setView] = useState('list');
            const [newTournamentName, setNewTournamentName] = useState('');
            const [newPlayerName, setNewPlayerName] = useState('');
            const [activeTab, setActiveTab] = useState('clasificacion');

            useEffect(() => {
                const saved = localStorage.getItem('yugioh-tournaments');
                if (saved) {
                    setTournaments(JSON.parse(saved));
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('yugioh-tournaments', JSON.stringify(tournaments));
            }, [tournaments]);

            const activeTournament = tournaments.find(t => t.id === activeTournamentId);

            function createTournament(name) {
                if (!name.trim()) return;
                const newT = {
                    id: Date.now(),
                    name: name.trim(),
                    players: [],
                    rounds: [],
                    currentRoundIndex: -1
                };
                setTournaments([...tournaments, newT]);
                setActiveTournamentId(newT.id);
                setView('tournament');
                setNewTournamentName('');
            }

            function deleteTournament(id) {
                if (!window.confirm('¿Eliminar este torneo?')) return;
                setTournaments(tournaments.filter(t => t.id !== id));
                if (activeTournamentId === id) {
                    setActiveTournamentId(null);
                    setView('list');
                }
            }

            function addPlayer(name) {
                if (!name.trim() || !activeTournament) return;
                const newP = {
                    id: Date.now(),
                    name: name.trim(),
                    points: 0,
                    wins: 0,
                    losses: 0,
                    ties: 0,
                    opponents: []
                };
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { ...t, players: [...t.players, newP] }
                        : t
                );
                setTournaments(updated);
                setNewPlayerName('');
            }

            function deletePlayer(pid) {
                if (!window.confirm('¿Eliminar este jugador?')) return;
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { ...t, players: t.players.filter(p => p.id !== pid) }
                        : t
                );
                setTournaments(updated);
            }

            function generateRound() {
                if (!activeTournament || activeTournament.players.length < 2) {
                    alert('Necesitas al menos 2 jugadores');
                    return;
                }

                const sorted = [...activeTournament.players].sort((a, b) => b.points - a.points);
                const matches = [];
                const used = new Set();

                for (let i = 0; i < sorted.length; i++) {
                    if (used.has(sorted[i].id)) continue;

                    let opp = null;
                    for (let j = i + 1; j < sorted.length; j++) {
                        if (!used.has(sorted[j].id) && !sorted[i].opponents.includes(sorted[j].id)) {
                            opp = sorted[j];
                            break;
                        }
                    }

                    if (!opp) {
                        for (let j = i + 1; j < sorted.length; j++) {
                            if (!used.has(sorted[j].id)) {
                                opp = sorted[j];
                                break;
                            }
                        }
                    }

                    if (opp) {
                        matches.push({
                            id: Date.now() + i,
                            p1: { ...sorted[i] },
                            p2: { ...opp },
                            result: null,
                            tiePoints: 0
                        });
                        used.add(sorted[i].id);
                        used.add(opp.id);
                    } else {
                        matches.push({
                            id: Date.now() + i,
                            p1: { ...sorted[i] },
                            p2: null,
                            result: 'bye',
                            byePoints: 3
                        });
                        used.add(sorted[i].id);
                    }
                }

                const newR = {
                    number: activeTournament.rounds.length + 1,
                    matches: matches,
                    completed: false
                };

                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { 
                            ...t, 
                            rounds: [...t.rounds, newR], 
                            currentRoundIndex: t.rounds.length
                          }
                        : t
                );
                setTournaments(updated);
                setActiveTab('rondas');
            }

            function setResult(mi, res, tiePoints = 0) {
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    const newRounds = [...t.rounds];
                    if (newRounds[t.currentRoundIndex]) {
                        newRounds[t.currentRoundIndex].matches[mi].result = res;
                        if (res === 'tie') {
                            newRounds[t.currentRoundIndex].matches[mi].tiePoints = tiePoints;
                        }
                    }
                    return { ...t, rounds: newRounds };
                });
                setTournaments(updated);
            }

            function setByePoints(mi, pts) {
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    const newRounds = [...t.rounds];
                    if (newRounds[t.currentRoundIndex]) {
                        newRounds[t.currentRoundIndex].matches[mi].byePoints = pts;
                    }
                    return { ...t, rounds: newRounds };
                });
                setTournaments(updated);
            }

            function completeRound() {
                if (!activeTournament) return;
                const round = activeTournament.rounds[activeTournament.currentRoundIndex];
                
                if (!round || !round.matches.every(m => m.result !== null)) {
                    alert('Completa todos los duelos');
                    return;
                }

                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    
                    const newPlayers = [...t.players];
                    round.matches.forEach(m => {
                        if (m.result === 'bye') {
                            const p = newPlayers.find(pl => pl.id === m.p1.id);
                            if (p) {
                                p.points += m.byePoints || 3;
                                p.wins += 1;
                            }
                        } else if (m.p2) {
                            const p1 = newPlayers.find(pl => pl.id === m.p1.id);
                            const p2 = newPlayers.find(pl => pl.id === m.p2.id);
                            
                            if (p1 && p2) {
                                if (!p1.opponents.includes(p2.id)) p1.opponents.push(p2.id);
                                if (!p2.opponents.includes(p1.id)) p2.opponents.push(p1.id);

                                if (m.result === 'p1') {
                                    p1.points += 3;
                                    p1.wins += 1;
                                    p2.losses += 1;
                                } else if (m.result === 'p2') {
                                    p2.points += 3;
                                    p2.wins += 1;
                                    p1.losses += 1;
                                } else if (m.result === 'tie') {
                                    p1.points += m.tiePoints;
                                    p2.points += m.tiePoints;
                                    p1.ties += 1;
                                    p2.ties += 1;
                                }
                            }
                        }
                    });

                    const newRounds = [...t.rounds];
                    if (newRounds[t.currentRoundIndex]) {
                        newRounds[t.currentRoundIndex].completed = true;
                    }

                    return { ...t, players: newPlayers, rounds: newRounds };
                });
                setTournaments(updated);
            }

            function deleteRound(ri) {
                if (!window.confirm('¿Eliminar esta ronda?')) return;
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    
                    const roundToDelete = t.rounds[ri];
                    if (roundToDelete.completed) {
                        const newPlayers = [...t.players];
                        roundToDelete.matches.forEach(m => {
                            if (m.result === 'bye') {
                                const p = newPlayers.find(pl => pl.id === m.p1.id);
                                if (p) {
                                    p.points -= m.byePoints || 3;
                                    p.wins -= 1;
                                }
                            } else if (m.p2) {
                                const p1 = newPlayers.find(pl => pl.id === m.p1.id);
                                const p2 = newPlayers.find(pl => pl.id === m.p2.id);
                                
                                if (p1 && p2) {
                                    p1.opponents = p1.opponents.filter(id => id !== p2.id);
                                    p2.opponents = p2.opponents.filter(id => id !== p1.id);

                                    if (m.result === 'p1') {
                                        p1.points -= 3;
                                        p1.wins -= 1;
                                        p2.losses -= 1;
                                    } else if (m.result === 'p2') {
                                        p2.points -= 3;
                                        p2.wins -= 1;
                                        p1.losses -= 1;
                                    } else if (m.result === 'tie') {
                                        p1.points -= m.tiePoints;
                                        p2.points -= m.tiePoints;
                                        p1.ties -= 1;
                                        p2.ties -= 1;
                                    }
                                }
                            }
                        });
                    }

                    const newRounds = t.rounds.filter((r, i) => i !== ri);
                    let newCurrentRoundIndex = t.currentRoundIndex;
                    
                    if (ri === t.currentRoundIndex) {
                        newCurrentRoundIndex = newRounds.length > 0 ? newRounds.length - 1 : -1;
                    } else if (ri < t.currentRoundIndex) {
                        newCurrentRoundIndex = t.currentRoundIndex - 1;
                    }

                    return { 
                        ...t, 
                        players: roundToDelete.completed ? newPlayers : t.players,
                        rounds: newRounds, 
                        currentRoundIndex: newCurrentRoundIndex 
                    };
                });
                setTournaments(updated);
            }

            function changeRound(i) {
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId ? { ...t, currentRoundIndex: i } : t
                );
                setTournaments(updated);
            }

            const sortedPlayers = activeTournament ? [...activeTournament.players].sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                if (b.wins !== a.wins) return b.wins - a.wins;
                return a.losses - b.losses;
            }) : [];

            // Vista principal - Lista de torneos
            if (view === 'list') {
                return (
                    <div className="min-h-screen bg-gray-50 p-3 scroll-smooth">
                        <div className="max-w-2xl mx-auto">
                            {/* Header más compacto */}
                            <div className="mb-4">
                                <h1 className="text-xl font-bold text-gray-900 text-center">
                                    Torneos Yu-Gi-Oh!
                                </h1>
                            </div>

                            {/* Sección Mis Torneos - más compacta */}
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-3 mb-3">
                                <h2 className="text-md font-bold text-gray-900 mb-3">
                                    Mis Torneos
                                </h2>

                                {/* Input más compacto */}
                                <div className="flex gap-2 mb-3">
                                    <input
                                        type="text"
                                        placeholder="Nombre del torneo"
                                        value={newTournamentName}
                                        onChange={(e) => setNewTournamentName(e.target.value)}
                                        className="flex-1 px-3 py-2 border border-gray-300 rounded text-sm"
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter') {
                                                createTournament(newTournamentName);
                                            }
                                        }}
                                    />
                                    <button
                                        onClick={() => createTournament(newTournamentName)}
                                        className="btn-primary px-3 py-2 rounded text-sm min-w-[44px]"
                                    >
                                        <Plus className="w-4 h-4" />
                                    </button>
                                </div>

                                {/* Lista de torneos más compacta */}
                                {tournaments.length === 0 ? (
                                    <div className="text-center py-6">
                                        <p className="text-gray-500 text-sm">No hay torneos</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2 max-h-60 overflow-y-auto">
                                        {tournaments.map(t => (
                                            <div key={t.id} className="flex justify-between items-center p-2 bg-gray-50 rounded border border-gray-200">
                                                <div className="flex-1 min-w-0">
                                                    <span className="font-medium text-gray-900 text-sm block truncate">{t.name}</span>
                                                    <p className="text-xs text-gray-600">{t.players.length} jug • {t.rounds.length} rondas</p>
                                                </div>
                                                <div className="flex gap-1 ml-2">
                                                    <button
                                                        onClick={() => {
                                                            setActiveTournamentId(t.id);
                                                            setView('tournament');
                                                        }}
                                                        className="btn-primary px-2 py-1 rounded text-xs min-w-[50px]"
                                                    >
                                                        Abrir
                                                    </button>
                                                    <button
                                                        onClick={() => deleteTournament(t.id)}
                                                        className="btn-danger px-2 py-1 rounded text-xs min-w-[32px]"
                                                    >
                                                        <X className="w-3 h-3" />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // Vista de torneo individual
            if (view === 'tournament' && activeTournament) {
                const currentRound = activeTournament.currentRoundIndex >= 0 
                    ? activeTournament.rounds[activeTournament.currentRoundIndex] 
                    : null;

                return (
                    <div className="min-h-screen bg-gray-50 p-3 scroll-smooth">
                        <div className="max-w-4xl mx-auto">
                            {/* Botón Atrás más compacto */}
                            <button
                                onClick={() => setView('list')}
                                className="flex items-center gap-1 text-gray-600 mb-3 hover:bg-white px-2 py-1 rounded text-sm"
                            >
                                <ArrowLeft className="w-3 h-3" />
                                Atrás
                            </button>

                            {/* Header del Torneo más compacto */}
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-3 mb-3">
                                <h1 className="text-lg font-bold text-gray-900 text-center truncate">
                                    {activeTournament.name}
                                </h1>
                            </div>

                            {/* Pestañas más compactas */}
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 mb-3">
                                <div className="flex border-b border-gray-200">
                                    <button
                                        onClick={() => setActiveTab('clasificacion')}
                                        className={`flex-1 py-2 text-xs font-medium ${
                                            activeTab === 'clasificacion'
                                                ? 'text-blue-600 border-b-2 border-blue-600'
                                                : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        Clasificación
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('jugadores')}
                                        className={`flex-1 py-2 text-xs font-medium ${
                                            activeTab === 'jugadores'
                                                ? 'text-blue-600 border-b-2 border-blue-600'
                                                : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        Jugadores
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('rondas')}
                                        className={`flex-1 py-2 text-xs font-medium ${
                                            activeTab === 'rondas'
                                                ? 'text-blue-600 border-b-2 border-blue-600'
                                                : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        Rondas
                                    </button>
                                </div>

                                {/* Contenido de las pestañas */}
                                <div className="p-3">
                                    {/* Pestaña Clasificación - Mejorada */}
                                    {activeTab === 'clasificacion' && (
                                        <div>
                                            <h2 className="text-md font-bold text-gray-900 mb-3">Clasificación</h2>
                                            {sortedPlayers.length === 0 ? (
                                                <p className="text-gray-500 text-center py-6 text-sm">No hay jugadores</p>
                                            ) : (
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-xs">
                                                        <thead>
                                                            <tr className="border-b border-gray-200">
                                                                <th className="text-left py-1 font-semibold text-gray-900 w-8">#</th>
                                                                <th className="text-left py-1 font-semibold text-gray-900">Jugador</th>
                                                                <th className="text-center py-1 font-semibold text-gray-900 w-12">Pts</th>
                                                                <th className="text-center py-1 font-semibold text-gray-900 w-8">W</th>
                                                                <th className="text-center py-1 font-semibold text-gray-900 w-8">L</th>
                                                                <th className="text-center py-1 font-semibold text-gray-900 w-8">T</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {sortedPlayers.map((p, i) => (
                                                                <tr key={p.id} className="border-b border-gray-100">
                                                                    <td className="py-2 font-semibold text-gray-900 text-center">{i + 1}</td>
                                                                    <td className="py-2 font-medium text-gray-900 truncate max-w-[120px]">{p.name}</td>
                                                                    <td className="py-2 text-center font-semibold text-gray-900">{p.points}</td>
                                                                    <td className="py-2 text-center text-gray-600">{p.wins}</td>
                                                                    <td className="py-2 text-center text-gray-600">{p.losses}</td>
                                                                    <td className="py-2 text-center text-gray-600">{p.ties}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Pestaña Jugadores - Mejorada */}
                                    {activeTab === 'jugadores' && (
                                        <div>
                                            <h2 className="text-md font-bold text-gray-900 mb-3">Jugadores</h2>
                                            
                                            {/* Input más compacto */}
                                            <div className="flex gap-2 mb-3">
                                                <input
                                                    type="text"
                                                    placeholder="Nombre del jugador"
                                                    value={newPlayerName}
                                                    onChange={(e) => setNewPlayerName(e.target.value)}
                                                    className="flex-1 px-3 py-2 border border-gray-300 rounded text-sm"
                                                    onKeyPress={(e) => {
                                                        if (e.key === 'Enter') {
                                                            addPlayer(newPlayerName);
                                                        }
                                                    }}
                                                />
                                                <button
                                                    onClick={() => addPlayer(newPlayerName)}
                                                    className="btn-primary px-3 py-2 rounded text-sm min-w-[44px]"
                                                >
                                                    <Plus className="w-4 h-4" />
                                                </button>
                                            </div>

                                            {/* Lista de jugadores más compacta */}
                                            {activeTournament.players.length === 0 ? (
                                                <p className="text-gray-500 text-center py-6 text-sm">No hay jugadores</p>
                                            ) : (
                                                <div className="space-y-2 max-h-48 overflow-y-auto">
                                                    {activeTournament.players.map((p) => (
                                                        <div key={p.id} className="flex justify-between items-center p-2 bg-gray-50 rounded border border-gray-200">
                                                            <div className="flex-1 min-w-0">
                                                                <p className="font-medium text-gray-900 text-sm truncate">{p.name}</p>
                                                                <p className="text-xs text-gray-600">{p.points} puntos • W:{p.wins} L:{p.losses} T:{p.ties}</p>
                                                            </div>
                                                            <button
                                                                onClick={() => deletePlayer(p.id)}
                                                                className="btn-danger px-2 py-1 rounded text-xs ml-2 min-w-[32px]"
                                                            >
                                                                <X className="w-3 h-3" />
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Pestaña Rondas - Mejorada */}
                                    {activeTab === 'rondas' && (
                                        <div>
                                            <div className="flex justify-between items-center mb-3">
                                                <h2 className="text-md font-bold text-gray-900">Rondas</h2>
                                                {activeTournament.players.length >= 2 && (
                                                    <button
                                                        onClick={generateRound}
                                                        className="btn-success px-3 py-1 rounded text-xs"
                                                    >
                                                        Ronda {activeTournament.rounds.length + 1}
                                                    </button>
                                                )}
                                            </div>

                                            {activeTournament.rounds.length === 0 ? (
                                                <p className="text-gray-500 text-center py-6 text-sm">No hay rondas generadas</p>
                                            ) : (
                                                <div className="space-y-3">
                                                    {/* Selector de rondas más compacto */}
                                                    <div className="flex gap-1 overflow-x-auto pb-1">
                                                        {activeTournament.rounds.map((r, i) => (
                                                            <button
                                                                key={i}
                                                                onClick={() => changeRound(i)}
                                                                className={`px-2 py-1 rounded text-xs font-medium whitespace-nowrap min-w-[60px] ${
                                                                    i === activeTournament.currentRoundIndex
                                                                        ? 'btn-primary'
                                                                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                }`}
                                                            >
                                                                R{r.number} {r.completed && '✓'}
                                                            </button>
                                                        ))}
                                                    </div>

                                                    {/* Tabla de la ronda actual mejorada */}
                                                    {currentRound && (
                                                        <div>
                                                            <div className="flex justify-between items-center mb-2">
                                                                <h3 className="text-sm font-bold text-gray-900">Ronda {currentRound.number}</h3>
                                                                <button
                                                                    onClick={() => deleteRound(activeTournament.currentRoundIndex)}
                                                                    className="btn-danger px-2 py-1 rounded text-xs flex items-center gap-1"
                                                                >
                                                                    <X className="w-3 h-3" />
                                                                    Eliminar
                                                                </button>
                                                            </div>
                                                            
                                                            <div className="overflow-x-auto">
                                                                <table className="w-full text-xs">
                                                                    <thead>
                                                                        <tr className="border-b border-gray-200">
                                                                            <th className="text-left py-1 font-semibold text-gray-900 w-10">Mesa</th>
                                                                            <th className="text-left py-1 font-semibold text-gray-900">Jugador 1</th>
                                                                            <th className="text-center py-1 font-semibold text-gray-900 w-6">VS</th>
                                                                            <th className="text-left py-1 font-semibold text-gray-900">Jugador 2</th>
                                                                            <th className="text-center py-1 font-semibold text-gray-900 w-20">Resultado</th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody>
                                                                        {currentRound.matches.map((m, mi) => (
                                                                            <tr key={m.id} className="border-b border-gray-100">
                                                                                <td className="py-2 font-semibold text-gray-900 text-center">#{mi + 1}</td>
                                                                                <td className="py-2">
                                                                                    <span className="font-medium text-gray-900 text-xs block truncate max-w-[80px]">{m.p1.name}</span>
                                                                                    <span className="text-[10px] text-gray-600 block">{m.p1.points}pts</span>
                                                                                </td>
                                                                                <td className="py-2 text-center text-gray-400 text-xs">VS</td>
                                                                                <td className="py-2">
                                                                                    {m.p2 ? (
                                                                                        <>
                                                                                            <span className="font-medium text-gray-900 text-xs block truncate max-w-[80px]">{m.p2.name}</span>
                                                                                            <span className="text-[10px] text-gray-600 block">{m.p2.points}pts</span>
                                                                                        </>
                                                                                    ) : (
                                                                                        <span className="text-gray-500 text-xs">BYE</span>
                                                                                    )}
                                                                                </td>
                                                                                <td className="py-2">
                                                                                    {m.p2 ? (
                                                                                        <div className="flex flex-col gap-1 items-center">
                                                                                            <div className="flex gap-1">
                                                                                                <button
                                                                                                    onClick={() => setResult(mi, 'p1')}
                                                                                                    className={`px-1 py-1 rounded text-[10px] font-medium min-w-[24px] ${
                                                                                                        m.result === 'p1'
                                                                                                            ? 'btn-success'
                                                                                                            : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                                                    }`}
                                                                                                >
                                                                                                    J1
                                                                                                </button>
                                                                                                <button
                                                                                                    onClick={() => setResult(mi, 'tie', 0)}
                                                                                                    className={`px-1 py-1 rounded text-[10px] font-medium min-w-[24px] ${
                                                                                                        m.result === 'tie'
                                                                                                            ? 'bg-blue-600 text-white'
                                                                                                            : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                                                    }`}
                                                                                                >
                                                                                                    Emp
                                                                                                </button>
                                                                                                <button
                                                                                                    onClick={() => setResult(mi, 'p2')}
                                                                                                    className={`px-1 py-1 rounded text-[10px] font-medium min-w-[24px] ${
                                                                                                        m.result === 'p2'
                                                                                                            ? 'btn-success'
                                                                                                            : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                                                    }`}
                                                                                                >
                                                                                                    J2
                                                                                                </button>
                                                                                            </div>
                                                                                            {m.result === 'tie' && (
                                                                                                <div className="flex gap-1 items-center">
                                                                                                    <span className="text-[10px] text-gray-600">Pts:</span>
                                                                                                    <div className="flex gap-1">
                                                                                                        {[0, 1].map(points => (
                                                                                                            <button
                                                                                                                key={points}
                                                                                                                onClick={() => setResult(mi, 'tie', points)}
                                                                                                                className={`w-5 h-5 rounded text-[10px] ${
                                                                                                                    m.tiePoints === points
                                                                                                                        ? 'bg-blue-600 text-white'
                                                                                                                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                                                                }`}
                                                                                                            >
                                                                                                                {points}
                                                                                                            </button>
                                                                                                        ))}
                                                                                                    </div>
                                                                                                </div>
                                                                                            )}
                                                                                        </div>
                                                                                    ) : (
                                                                                        <div className="flex flex-col gap-1 items-center">
                                                                                            <span className="text-[10px] text-gray-600">Puntos:</span>
                                                                                            <div className="flex gap-1">
                                                                                                {[0, 1, 2, 3].map(points => (
                                                                                                    <button
                                                                                                        key={points}
                                                                                                        onClick={() => setByePoints(mi, points)}
                                                                                                        className={`w-6 h-6 rounded text-[10px] font-medium ${
                                                                                                            m.byePoints === points
                                                                                                                ? 'btn-primary'
                                                                                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                                                        }`}
                                                                                                    >
                                                                                                        {points}
                                                                                                    </button>
                                                                                                ))}
                                                                                            </div>
                                                                                        </div>
                                                                                    )}
                                                                                </td>
                                                                            </tr>
                                                                        ))}
                                                                    </tbody>
                                                                </table>
                                                            </div>

                                                            {!currentRound.completed && (
                                                                <button
                                                                    onClick={completeRound}
                                                                    className="w-full btn-success py-2 rounded font-bold mt-3 text-sm"
                                                                >
                                                                    Completar Ronda {currentRound.number}
                                                                </button>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return <div className="text-gray-900 p-4 text-center">Cargando...</div>;
        }

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<TorneosYugioh />);
        } catch (error) {
            console.error('Error:', error);
        }
    </script>
</body>
</html>
