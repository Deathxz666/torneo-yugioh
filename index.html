<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#581c87">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Torneos Yu-Gi-Oh!</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden;
            background: #f8fafc;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }
        #root {
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Plus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
            </svg>
        );

        const X = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
            </svg>
        );

        const ArrowLeft = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
        );

        function TorneosYugioh() {
            const [tournaments, setTournaments] = useState([]);
            const [activeTournamentId, setActiveTournamentId] = useState(null);
            const [view, setView] = useState('list');
            const [newTournamentName, setNewTournamentName] = useState('');
            const [newPlayerName, setNewPlayerName] = useState('');

            useEffect(() => {
                const saved = localStorage.getItem('yugioh-tournaments');
                if (saved) {
                    setTournaments(JSON.parse(saved));
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('yugioh-tournaments', JSON.stringify(tournaments));
            }, [tournaments]);

            const activeTournament = tournaments.find(t => t.id === activeTournamentId);

            function createTournament(name) {
                if (!name.trim()) return;
                const newT = {
                    id: Date.now(),
                    name: name.trim(),
                    players: [],
                    rounds: [],
                    currentRoundIndex: 0
                };
                setTournaments([...tournaments, newT]);
                setActiveTournamentId(newT.id);
                setView('tournament');
                setNewTournamentName('');
            }

            function deleteTournament(id) {
                if (!window.confirm('¿Eliminar este torneo?')) return;
                setTournaments(tournaments.filter(t => t.id !== id));
                if (activeTournamentId === id) {
                    setActiveTournamentId(null);
                    setView('list');
                }
            }

            function addPlayer(name) {
                if (!name.trim() || !activeTournament) return;
                const newP = {
                    id: Date.now(),
                    name: name.trim(),
                    points: 0,
                    wins: 0,
                    losses: 0,
                    ties: 0,
                    opponents: []
                };
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { ...t, players: [...t.players, newP] }
                        : t
                );
                setTournaments(updated);
                setNewPlayerName('');
            }

            function deletePlayer(pid) {
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { ...t, players: t.players.filter(p => p.id !== pid) }
                        : t
                );
                setTournaments(updated);
            }

            function generateRound() {
                if (!activeTournament || activeTournament.players.length < 2) {
                    alert('Necesitas al menos 2 jugadores');
                    return;
                }

                const sorted = [...activeTournament.players].sort((a, b) => b.points - a.points);
                const matches = [];
                const used = new Set();

                for (let i = 0; i < sorted.length; i++) {
                    if (used.has(sorted[i].id)) continue;

                    let opp = null;
                    for (let j = i + 1; j < sorted.length; j++) {
                        if (!used.has(sorted[j].id) && !sorted[i].opponents.includes(sorted[j].id)) {
                            opp = sorted[j];
                            break;
                        }
                    }

                    if (!opp) {
                        for (let j = i + 1; j < sorted.length; j++) {
                            if (!used.has(sorted[j].id)) {
                                opp = sorted[j];
                                break;
                            }
                        }
                    }

                    if (opp) {
                        matches.push({
                            id: Date.now() + i,
                            p1: { ...sorted[i] },
                            p2: { ...opp },
                            result: null
                        });
                        used.add(sorted[i].id);
                        used.add(opp.id);
                    } else {
                        matches.push({
                            id: Date.now() + i,
                            p1: { ...sorted[i] },
                            p2: null,
                            result: 'bye'
                        });
                        used.add(sorted[i].id);
                    }
                }

                const newR = {
                    number: activeTournament.rounds.length + 1,
                    matches: matches,
                    completed: false
                };

                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { ...t, rounds: [...t.rounds, newR] }
                        : t
                );
                setTournaments(updated);
            }

            function setResult(mi, res) {
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    const newR = [...t.rounds];
                    newR[t.currentRoundIndex].matches[mi].result = res;
                    return { ...t, rounds: newR };
                });
                setTournaments(updated);
            }

            function completeRound() {
                if (!activeTournament) return;
                const round = activeTournament.rounds[activeTournament.currentRoundIndex];
                
                if (!round.matches.every(m => m.result !== null)) {
                    alert('Completa todos los duelos');
                    return;
                }

                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    
                    const newP = [...t.players];
                    round.matches.forEach(m => {
                        if (m.result === 'bye') {
                            const p = newP.find(pl => pl.id === m.p1.id);
                            if (p) {
                                p.points += 3;
                                p.wins += 1;
                            }
                        } else if (m.p2) {
                            const p1 = newP.find(pl => pl.id === m.p1.id);
                            const p2 = newP.find(pl => pl.id === m.p2.id);
                            
                            if (p1 && p2) {
                                if (!p1.opponents.includes(p2.id)) p1.opponents.push(p2.id);
                                if (!p2.opponents.includes(p1.id)) p2.opponents.push(p1.id);

                                if (m.result === 'p1') {
                                    p1.points += 3;
                                    p1.wins += 1;
                                    p2.losses += 1;
                                } else if (m.result === 'p2') {
                                    p2.points += 3;
                                    p2.wins += 1;
                                    p1.losses += 1;
                                } else if (m.result === 'tie') {
                                    p1.points += 1;
                                    p2.points += 1;
                                    p1.ties += 1;
                                    p2.ties += 1;
                                }
                            }
                        }
                    });

                    const newR = [...t.rounds];
                    newR[t.currentRoundIndex].completed = true;

                    return { ...t, players: newP, rounds: newR };
                });
                setTournaments(updated);
            }

            function deleteRound(ri) {
                if (!window.confirm('¿Eliminar esta ronda?')) return;
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    const newR = t.rounds.filter((r, i) => i !== ri);
                    return { ...t, rounds: newR };
                });
                setTournaments(updated);
            }

            function changeRound(i) {
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId ? { ...t, currentRoundIndex: i } : t
                );
                setTournaments(updated);
            }

            // Vista principal - Lista de torneos
            if (view === 'list') {
                return (
                    <div className="min-h-screen bg-gray-50 p-4">
                        <div className="max-w-2xl mx-auto">
                            {/* Header */}
                            <div className="mb-8">
                                <h1 className="text-2xl font-bold text-gray-900 text-center mb-2">
                                    Torneos Yu-Gi-Oh!
                                </h1>
                            </div>

                            {/* Sección Mis Torneos */}
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
                                <h2 className="text-lg font-bold text-gray-900 mb-4">
                                    Mis Torneos
                                </h2>

                                {/* Input para nuevo torneo */}
                                <div className="flex gap-2 mb-4">
                                    <input
                                        type="text"
                                        placeholder="Nombre del torneo"
                                        value={newTournamentName}
                                        onChange={(e) => setNewTournamentName(e.target.value)}
                                        className="flex-1 px-3 py-2 border border-gray-300 rounded text-sm"
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter') {
                                                createTournament(newTournamentName);
                                            }
                                        }}
                                    />
                                    <button
                                        onClick={() => createTournament(newTournamentName)}
                                        className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 flex items-center gap-1 text-sm"
                                    >
                                        <Plus className="w-4 h-4" />
                                    </button>
                                </div>

                                {/* Lista de torneos */}
                                {tournaments.length === 0 ? (
                                    <div className="text-center py-8">
                                        <p className="text-gray-500 text-sm">No hay torneos</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {tournaments.map(t => (
                                            <div key={t.id} className="flex justify-between items-center p-3 bg-gray-50 rounded border border-gray-200">
                                                <span className="font-medium text-gray-900 text-sm">{t.name}</span>
                                                <div className="flex gap-2">
                                                    <button
                                                        onClick={() => {
                                                            setActiveTournamentId(t.id);
                                                            setView('tournament');
                                                        }}
                                                        className="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700"
                                                    >
                                                        Abrir
                                                    </button>
                                                    <button
                                                        onClick={() => deleteTournament(t.id)}
                                                        className="bg-red-600 text-white px-2 py-1 rounded text-xs hover:bg-red-700"
                                                    >
                                                        <X className="w-3 h-3" />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // Vista de torneo individual
            if (view === 'tournament' && activeTournament) {
                const currentRound = activeTournament.rounds[activeTournament.currentRoundIndex];

                return (
                    <div className="min-h-screen bg-gray-50 p-4">
                        <div className="max-w-4xl mx-auto">
                            {/* Botón Atrás */}
                            <button
                                onClick={() => setView('list')}
                                className="flex items-center gap-2 text-gray-600 mb-4 hover:bg-white px-3 py-2 rounded text-sm"
                            >
                                <ArrowLeft className="w-4 h-4" />
                                Atrás
                            </button>

                            {/* Header del Torneo */}
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
                                <h1 className="text-xl font-bold text-gray-900 text-center mb-1">
                                    {activeTournament.name}
                                </h1>
                            </div>

                            {/* Sección de Clasificación y Rondas */}
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    {/* Columna Jugadores */}
                                    <div>
                                        <h2 className="text-md font-bold text-gray-900 mb-2">Clasificación</h2>
                                        <p className="text-sm text-gray-600 mb-3">Jugadores</p>
                                        
                                        {/* Input para añadir jugador */}
                                        <div className="flex gap-2 mb-3">
                                            <input
                                                type="text"
                                                placeholder="Nombre del jugador"
                                                value={newPlayerName}
                                                onChange={(e) => setNewPlayerName(e.target.value)}
                                                className="flex-1 px-3 py-2 border border-gray-300 rounded text-sm"
                                                onKeyPress={(e) => {
                                                    if (e.key === 'Enter') {
                                                        addPlayer(newPlayerName);
                                                    }
                                                }}
                                            />
                                            <button
                                                onClick={() => addPlayer(newPlayerName)}
                                                className="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700 text-sm"
                                            >
                                                <Plus className="w-4 h-4" />
                                            </button>
                                        </div>

                                        {/* Lista de jugadores */}
                                        {activeTournament.players.length === 0 ? (
                                            <p className="text-gray-500 text-sm text-center py-4">Sin jugadores</p>
                                        ) : (
                                            <div className="space-y-2 max-h-40 overflow-y-auto">
                                                {activeTournament.players.map((p, i) => (
                                                    <div key={p.id} className="flex justify-between items-center p-2 bg-gray-50 rounded border border-gray-200">
                                                        <div>
                                                            <p className="font-medium text-gray-900 text-sm">{p.name}</p>
                                                            <p className="text-xs text-gray-600">{p.points}pts</p>
                                                        </div>
                                                        <button
                                                            onClick={() => deletePlayer(p.id)}
                                                            className="text-red-600 hover:text-red-800 text-xs"
                                                        >
                                                            <X className="w-3 h-3" />
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* Columna Rondas */}
                                    <div>
                                        <h2 className="text-md font-bold text-gray-900 mb-2">Rondas</h2>
                                        <p className="text-sm text-gray-600 mb-3">Rondas</p>
                                        
                                        <div className="space-y-2 max-h-40 overflow-y-auto">
                                            {activeTournament.rounds.map((r, i) => (
                                                <div key={i} className="flex justify-between items-center p-2 bg-gray-50 rounded border border-gray-200">
                                                    <span className="font-medium text-gray-900 text-sm">Ronda {r.number}</span>
                                                    <div className="flex gap-1">
                                                        <button
                                                            onClick={() => changeRound(i)}
                                                            className="bg-blue-600 text-white px-2 py-1 rounded text-xs hover:bg-blue-700"
                                                        >
                                                            Ver
                                                        </button>
                                                        <button
                                                            onClick={() => deleteRound(i)}
                                                            className="bg-red-600 text-white px-2 py-1 rounded text-xs hover:bg-red-700"
                                                        >
                                                            <X className="w-3 h-3" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {activeTournament.players.length >= 2 && (
                                            <button
                                                onClick={generateRound}
                                                className="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700 mt-3 text-sm"
                                            >
                                                Generar Ronda {activeTournament.rounds.length + 1}
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* Línea divisoria */}
                                <div className="border-t border-gray-200 my-4"></div>

                                {/* Tabla de rondas actual */}
                                {currentRound && (
                                    <div>
                                        <h3 className="text-md font-bold text-gray-900 mb-3">Ronda {currentRound.number}</h3>
                                        
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm">
                                                <thead>
                                                    <tr className="border-b border-gray-200">
                                                        <th className="text-left py-2 font-semibold text-gray-900">Mesa</th>
                                                        <th className="text-left py-2 font-semibold text-gray-900">Jugador 1</th>
                                                        <th className="text-center py-2 font-semibold text-gray-900">VS</th>
                                                        <th className="text-left py-2 font-semibold text-gray-900">Jugador 2</th>
                                                        <th className="text-center py-2 font-semibold text-gray-900">Resultado</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {currentRound.matches.map((m, mi) => (
                                                        <tr key={m.id} className="border-b border-gray-100">
                                                            <td className="py-3 font-semibold text-gray-900">#{mi + 1}</td>
                                                            <td className="py-3">
                                                                <span className="font-medium text-gray-900">{m.p1.name}</span>
                                                                <span className="text-xs text-gray-600 block">{m.p1.points}pts</span>
                                                            </td>
                                                            <td className="py-3 text-center">
                                                                {m.p2 ? (
                                                                    <span className="text-gray-400">🍀</span>
                                                                ) : (
                                                                    <span className="text-xs text-gray-500">BYE</span>
                                                                )}
                                                            </td>
                                                            <td className="py-3">
                                                                {m.p2 ? (
                                                                    <>
                                                                        <span className="font-medium text-gray-900">{m.p2.name}</span>
                                                                        <span className="text-xs text-gray-600 block">{m.p2.points}pts</span>
                                                                    </>
                                                                ) : (
                                                                    <span className="text-gray-500">BYE</span>
                                                                )}
                                                            </td>
                                                            <td className="py-3">
                                                                {m.p2 ? (
                                                                    <div className="flex gap-1 justify-center">
                                                                        <button
                                                                            onClick={() => setResult(mi, 'p1')}
                                                                            className={`px-2 py-1 rounded text-xs font-medium ${
                                                                                m.result === 'p1'
                                                                                    ? 'bg-green-600 text-white'
                                                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                            }`}
                                                                        >
                                                                            J1
                                                                        </button>
                                                                        <button
                                                                            onClick={() => setResult(mi, 'tie')}
                                                                            className={`px-2 py-1 rounded text-xs font-medium ${
                                                                                m.result === 'tie'
                                                                                    ? 'bg-blue-600 text-white'
                                                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                            }`}
                                                                        >
                                                                            Emp
                                                                        </button>
                                                                        <button
                                                                            onClick={() => setResult(mi, 'p2')}
                                                                            className={`px-2 py-1 rounded text-xs font-medium ${
                                                                                m.result === 'p2'
                                                                                    ? 'bg-green-600 text-white'
                                                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                            }`}
                                                                        >
                                                                            J2
                                                                        </button>
                                                                    </div>
                                                                ) : (
                                                                    <div className="text-center">
                                                                        <span className="text-xs text-gray-600">BYE</span>
                                                                    </div>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>

                                        {!currentRound.completed && (
                                            <button
                                                onClick={completeRound}
                                                className="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700 mt-4 text-sm"
                                            >
                                                Completar Ronda {currentRound.number}
                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return <div className="text-gray-900 p-4 text-center">Cargando...</div>;
        }

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<TorneosYugioh />);
        } catch (error) {
            console.error('Error:', error);
        }
    </script>
</body>
</html>
