<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Torneos Yu-Gi-Oh!</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Iconos SVG simples
        const Trophy = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
            </svg>
        );

        const Trash2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        );

        const Plus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
            </svg>
        );

        const Users = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        );

        const Medal = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Swords = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        );

        const Play = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const X = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
            </svg>
        );

        const ChevronRight = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
        );

        function YugiohTournament() {
            const [tournaments, setTournaments] = useState([]);
            const [activeTournamentId, setActiveTournamentId] = useState(null);
            const [view, setView] = useState('list');

            const activeTournament = tournaments.find(t => t.id === activeTournamentId);

            function createTournament(name) {
                if (!name.trim()) return;
                const newTournament = {
                    id: Date.now(),
                    name: name.trim(),
                    players: [],
                    rounds: [],
                    currentRoundIndex: 0
                };
                setTournaments([...tournaments, newTournament]);
                setActiveTournamentId(newTournament.id);
                setView('standings');
            }

            function deleteTournamentDirect(id) {
                if (!window.confirm('¿Eliminar este torneo?')) return;
                setTournaments(tournaments.filter(t => t.id !== id));
                if (activeTournamentId === id) {
                    setActiveTournamentId(null);
                    setView('list');
                }
            }

            function addPlayer(name) {
                if (!name.trim() || !activeTournament) return;
                const newPlayer = {
                    id: Date.now(),
                    name: name.trim(),
                    points: 0,
                    wins: 0,
                    losses: 0,
                    ties: 0,
                    opponents: []
                };
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { ...t, players: [...t.players, newPlayer] }
                        : t
                );
                setTournaments(updated);
            }

            function deletePlayer(playerId) {
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { ...t, players: t.players.filter(p => p.id !== playerId) }
                        : t
                );
                setTournaments(updated);
            }

            function generateRound() {
                if (!activeTournament || activeTournament.players.length < 2) {
                    alert('Necesitas al menos 2 jugadores');
                    return;
                }

                const sorted = [...activeTournament.players].sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    if (b.wins !== a.wins) return b.wins - a.wins;
                    return a.losses - b.losses;
                });

                const matches = [];
                const used = new Set();

                for (let i = 0; i < sorted.length; i++) {
                    if (used.has(sorted[i].id)) continue;

                    let opponent = null;
                    for (let j = i + 1; j < sorted.length; j++) {
                        if (!used.has(sorted[j].id) && !sorted[i].opponents.includes(sorted[j].id)) {
                            opponent = sorted[j];
                            break;
                        }
                    }

                    if (!opponent) {
                        for (let j = i + 1; j < sorted.length; j++) {
                            if (!used.has(sorted[j].id)) {
                                opponent = sorted[j];
                                break;
                            }
                        }
                    }

                    if (opponent) {
                        matches.push({
                            id: Date.now() + i,
                            p1: { ...sorted[i] },
                            p2: { ...opponent },
                            result: null,
                            tiePoints: 1
                        });
                        used.add(sorted[i].id);
                        used.add(opponent.id);
                    } else {
                        matches.push({
                            id: Date.now() + i,
                            p1: { ...sorted[i] },
                            p2: null,
                            result: 'bye',
                            byePoints: 3
                        });
                        used.add(sorted[i].id);
                    }
                }

                const newRound = {
                    number: activeTournament.rounds.length + 1,
                    matches: matches,
                    completed: false
                };

                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { ...t, rounds: [...t.rounds, newRound], currentRoundIndex: t.rounds.length }
                        : t
                );
                setTournaments(updated);
                setView('rounds');
            }

            function setResult(matchIndex, result, points) {
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    const newRounds = [...t.rounds];
                    newRounds[t.currentRoundIndex].matches[matchIndex].result = result;
                    if (result === 'tie') {
                        newRounds[t.currentRoundIndex].matches[matchIndex].tiePoints = points;
                    }
                    return { ...t, rounds: newRounds };
                });
                setTournaments(updated);
            }

            function setByePoints(matchIndex, points) {
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    const newRounds = [...t.rounds];
                    newRounds[t.currentRoundIndex].matches[matchIndex].byePoints = points;
                    return { ...t, rounds: newRounds };
                });
                setTournaments(updated);
            }

            function completeRound() {
                if (!activeTournament) return;
                const round = activeTournament.rounds[activeTournament.currentRoundIndex];
                
                const allDone = round.matches.every(m => m.result !== null);
                if (!allDone) {
                    alert('Completa todos los duelos primero');
                    return;
                }

                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    
                    const newPlayers = [...t.players];
                    round.matches.forEach(match => {
                        if (match.result === 'bye') {
                            const p = newPlayers.find(pl => pl.id === match.p1.id);
                            if (p) {
                                p.points += match.byePoints || 3;
                                p.wins += 1;
                            }
                        } else if (match.p2) {
                            const p1 = newPlayers.find(pl => pl.id === match.p1.id);
                            const p2 = newPlayers.find(pl => pl.id === match.p2.id);
                            
                            if (p1 && p2) {
                                if (!p1.opponents.includes(p2.id)) p1.opponents.push(p2.id);
                                if (!p2.opponents.includes(p1.id)) p2.opponents.push(p1.id);

                                if (match.result === 'p1') {
                                    p1.points += 3;
                                    p1.wins += 1;
                                    p2.losses += 1;
                                } else if (match.result === 'p2') {
                                    p2.points += 3;
                                    p2.wins += 1;
                                    p1.losses += 1;
                                } else if (match.result === 'tie') {
                                    p1.points += match.tiePoints;
                                    p2.points += match.tiePoints;
                                    p1.ties += 1;
                                    p2.ties += 1;
                                }
                            }
                        }
                    });

                    const newRounds = [...t.rounds];
                    newRounds[t.currentRoundIndex].completed = true;

                    return { ...t, players: newPlayers, rounds: newRounds };
                });
                setTournaments(updated);
            }

            function deleteRoundDirect(roundIndex) {
                if (!window.confirm('¿Eliminar esta ronda?')) return;
                
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    
                    const round = t.rounds[roundIndex];
                    let newPlayers = [...t.players];

                    if (round.completed) {
                        round.matches.forEach(match => {
                            if (match.result === 'bye') {
                                const p = newPlayers.find(pl => pl.id === match.p1.id);
                                if (p) {
                                    p.points -= match.byePoints || 3;
                                    p.wins -= 1;
                                }
                            } else if (match.p2) {
                                const p1 = newPlayers.find(pl => pl.id === match.p1.id);
                                const p2 = newPlayers.find(pl => pl.id === match.p2.id);
                                
                                if (p1 && p2) {
                                    p1.opponents = p1.opponents.filter(id => id !== p2.id);
                                    p2.opponents = p2.opponents.filter(id => id !== p1.id);

                                    if (match.result === 'p1') {
                                        p1.points -= 3;
                                        p1.wins -= 1;
                                        p2.losses -= 1;
                                    } else if (match.result === 'p2') {
                                        p2.points -= 3;
                                        p2.wins -= 1;
                                        p1.losses -= 1;
                                    } else if (match.result === 'tie') {
                                        p1.points -= match.tiePoints;
                                        p2.points -= match.tiePoints;
                                        p1.ties -= 1;
                                        p2.ties -= 1;
                                    }
                                }
                            }
                        });
                    }

                    const newRounds = t.rounds.filter((r, i) => i !== roundIndex);
                    let newIndex = t.currentRoundIndex;
                    if (newIndex >= newRounds.length && newRounds.length > 0) {
                        newIndex = newRounds.length - 1;
                    } else if (newRounds.length === 0) {
                        newIndex = 0;
                    }

                    return { ...t, players: newPlayers, rounds: newRounds, currentRoundIndex: newIndex };
                });
                setTournaments(updated);
            }

            function changeRound(index) {
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId ? { ...t, currentRoundIndex: index } : t
                );
                setTournaments(updated);
            }

            const sortedPlayers = activeTournament ? [...activeTournament.players].sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                if (b.wins !== a.wins) return b.wins - a.wins;
                return a.losses - b.losses;
            }) : [];

            const canGenerate = activeTournament && (
                activeTournament.rounds.length === 0 || 
                activeTournament.rounds[activeTournament.rounds.length - 1].completed
            );

            if (!activeTournamentId || view === 'list') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 p-4">
                        <div className="max-w-6xl mx-auto">
                            <div className="bg-gradient-to-r from-yellow-400 to-yellow-600 rounded-lg shadow-2xl p-6 mb-6 border-4 border-yellow-300">
                                <div className="flex items-center justify-center gap-3">
                                    <Trophy className="w-10 h-10 text-purple-900" />
                                    <h1 className="text-4xl font-bold text-purple-900">Gestor de Torneos Yu-Gi-Oh!</h1>
                                    <Trophy className="w-10 h-10 text-purple-900" />
                                </div>
                            </div>

                            <div className="bg-white rounded-lg shadow-xl p-6">
                                <h2 className="text-2xl font-bold text-purple-900 mb-4">Mis Torneos</h2>

                                <div className="flex gap-3 mb-6">
                                    <input
                                        id="tournamentName"
                                        type="text"
                                        placeholder="Nombre del torneo"
                                        className="flex-1 px-4 py-3 border-2 border-purple-300 rounded-lg"
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter') {
                                                createTournament(e.target.value);
                                                e.target.value = '';
                                            }
                                        }}
                                    />
                                    <button
                                        onClick={() => {
                                            const input = document.getElementById('tournamentName');
                                            createTournament(input.value);
                                            input.value = '';
                                        }}
                                        className="bg-purple-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-purple-700"
                                    >
                                        <Plus className="w-5 h-5 inline mr-2" />
                                        Crear
                                    </button>
                                </div>

                                {tournaments.length === 0 ? (
                                    <div className="text-center py-12">
                                        <Trophy className="w-16 h-16 text-gray-300 mx-auto mb-4" />
                                        <p className="text-gray-500">No hay torneos creados</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {tournaments.map(t => (
                                            <div key={t.id} className="bg-purple-100 p-6 rounded-lg border-2 border-purple-300">
                                                <div className="flex justify-between mb-3">
                                                    <div>
                                                        <h3 className="text-xl font-bold text-purple-900">{t.name}</h3>
                                                        <p className="text-sm text-gray-600">{t.players.length} jugadores • {t.rounds.length} rondas</p>
                                                    </div>
                                                    <button
                                                        onClick={() => deleteTournamentDirect(t.id)}
                                                        className="text-red-600 hover:bg-red-100 p-2 rounded h-10"
                                                    >
                                                        <Trash2 className="w-5 h-5" />
                                                    </button>
                                                </div>
                                                <button
                                                    onClick={() => {
                                                        setActiveTournamentId(t.id);
                                                        setView('standings');
                                                    }}
                                                    className="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700"
                                                    >
                                                    Abrir
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 p-4">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-gradient-to-r from-yellow-400 to-yellow-600 rounded-lg shadow-2xl p-6 mb-6 border-4 border-yellow-300">
                            <div className="flex items-center justify-between">
                                <button
                                    onClick={() => setView('list')}
                                    className="bg-purple-900 text-yellow-400 px-4 py-2 rounded-lg font-semibold"
                                >
                                    ? Torneos
                                </button>
                                <div className="flex items-center gap-3">
                                    <Trophy className="w-10 h-10 text-purple-900" />
                                    <h1 className="text-3xl font-bold text-purple-900">{activeTournament.name}</h1>
                                </div>
                                <div className="w-24"></div>
                            </div>
                        </div>

                        <div className="flex gap-2 mb-6">
                            <button
                                onClick={() => setView('standings')}
                                className={'px-6 py-3 rounded-lg font-semibold ' + (view === 'standings' ? 'bg-yellow-400 text-purple-900' : 'bg-purple-800 text-white')}
                            >
                                <Medal className="w-5 h-5 inline mr-2" />
                                Clasificación
                            </button>
                            <button
                                onClick={() => setView('players')}
                                className={'px-6 py-3 rounded-lg font-semibold ' + (view === 'players' ? 'bg-yellow-400 text-purple-900' : 'bg-purple-800 text-white')}
                            >
                                <Users className="w-5 h-5 inline mr-2" />
                                Jugadores
                            </button>
                            <button
                                onClick={() => setView('rounds')}
                                className={'px-6 py-3 rounded-lg font-semibold ' + (view === 'rounds' ? 'bg-yellow-400 text-purple-900' : 'bg-purple-800 text-white')}
                            >
                                <Swords className="w-5 h-5 inline mr-2" />
                                Rondas
                            </button>
                        </div>

                        {view === 'players' && (
                            <div className="bg-white rounded-lg shadow-xl p-6">
                                <h2 className="text-2xl font-bold text-purple-900 mb-4">Jugadores</h2>
                                
                                <div className="flex gap-3 mb-6">
                                    <input
                                        id="playerName"
                                        type="text"
                                        placeholder="Nombre del jugador"
                                        className="flex-1 px-4 py-3 border-2 border-purple-300 rounded-lg"
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter') {
                                                addPlayer(e.target.value);
                                                e.target.value = '';
                                            }
                                        }}
                                    />
                                    <button
                                        onClick={() => {
                                            const input = document.getElementById('playerName');
                                            addPlayer(input.value);
                                            input.value = '';
                                        }}
                                        className="bg-purple-600 text-white px-6 py-3 rounded-lg"
                                    >
                                        Agregar
                                    </button>
                                </div>

                                <div className="space-y-2">
                                    {activeTournament.players.map(p => (
                                        <div key={p.id} className="flex justify-between items-center bg-purple-100 p-4 rounded-lg">
                                            <span className="font-semibold">{p.name}</span>
                                            <button
                                                onClick={() => deletePlayer(p.id)}
                                                className="text-red-600 hover:text-red-800"
                                            >
                                                <Trash2 className="w-5 h-5" />
                                            </button>
                                        </div>
                                    ))}
                                    {activeTournament.players.length === 0 && (
                                        <p className="text-center text-gray-500 py-8">No hay jugadores</p>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'rounds' && (
                            <div className="bg-white rounded-lg shadow-xl p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-bold text-purple-900">Rondas</h2>
                                    {canGenerate && activeTournament.players.length >= 2 && (
                                        <button
                                            onClick={generateRound}
                                            className="bg-green-600 text-white px-6 py-3 rounded-lg font-bold"
                                        >
                                            <Play className="w-5 h-5 inline mr-2" />
                                            {activeTournament.rounds.length === 0 ? 'Iniciar' : 'Nueva Ronda'}
                                        </button>
                                    )}
                                </div>

                                {activeTournament.rounds.length === 0 ? (
                                    <div className="text-center py-12">
                                        <Swords className="w-16 h-16 text-gray-300 mx-auto mb-4" />
                                        <p className="text-gray-500">No hay rondas</p>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="flex gap-2 mb-6 overflow-x-auto pb-2">
                                            {activeTournament.rounds.map((r, i) => (
                                                <div key={i} className="relative">
                                                    <button
                                                        onClick={() => changeRound(i)}
                                                        className={'px-4 py-2 rounded-lg font-semibold ' + (activeTournament.currentRoundIndex === i ? 'bg-purple-600 text-white' : r.completed ? 'bg-green-100 text-green-700' : 'bg-gray-200')}
                                                    >
                                                        Ronda {r.number} {r.completed && '?'}
                                                    </button>
                                                    <button
                                                        onClick={() => deleteRoundDirect(i)}
                                                        className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600 w-6 h-6 flex items-center justify-center"
                                                    >
                                                        <X className="w-3 h-3" />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>

                                        {activeTournament.rounds[activeTournament.currentRoundIndex] && (
                                            <div>
                                                <table className="w-full">
                                                    <thead>
                                                        <tr className="bg-purple-600 text-white">
                                                            <th className="px-4 py-3 text-left">Mesa</th>
                                                            <th className="px-4 py-3 text-left">Jugador 1</th>
                                                            <th className="px-4 py-3 text-center">VS</th>
                                                            <th className="px-4 py-3 text-left">Jugador 2</th>
                                                            <th className="px-4 py-3 text-center">Resultado</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {activeTournament.rounds[activeTournament.currentRoundIndex].matches.map((m, mi) => (
                                                            <tr key={m.id} className="border-b">
                                                                <td className="px-4 py-3">#{mi + 1}</td>
                                                                <td className="px-4 py-3">
                                                                    <div className="font-semibold">{m.p1.name}</div>
                                                                    <div className="text-xs text-gray-500">{m.p1.points} pts</div>
                                                                </td>
                                                                <td className="px-4 py-3 text-center">
                                                                    <Swords className="w-5 h-5 mx-auto text-purple-600" />
                                                                </td>
                                                                <td className="px-4 py-3">
                                                                    {m.p2 ? (
                                                                        <>
                                                                            <div className="font-semibold">{m.p2.name}</div>
                                                                            <div className="text-xs text-gray-500">{m.p2.points} pts</div>
                                                                        </>
                                                                    ) : (
                                                                        <span className="text-gray-400">BYE</span>
                                                                    )}
                                                                </td>
                                                                <td className="px-4 py-3">
                                                                    {activeTournament.rounds[activeTournament.currentRoundIndex].completed ? (
                                                                        <div className="text-center">
                                                                            {m.result === 'bye' && (
                                                                                <span className="bg-blue-500 text-white px-3 py-1 rounded-full text-sm">
                                                                                    BYE {m.byePoints}pts
                                                                                </span>
                                                                            )}
                                                                            {m.result === 'p1' && (
                                                                                <span className="bg-green-500 text-white px-3 py-1 rounded-full text-sm">
                                                                                    Victoria J1
                                                                                </span>
                                                                            )}
                                                                            {m.result === 'p2' && (
                                                                                <span className="bg-green-500 text-white px-3 py-1 rounded-full text-sm">
                                                                                    Victoria J2
                                                                                </span>
                                                                            )}
                                                                            {m.result === 'tie' && (
                                                                                <span className="bg-yellow-500 text-white px-3 py-1 rounded-full text-sm">
                                                                                    Empate {m.tiePoints}pt
                                                                                </span>
                                                                            )}
                                                                        </div>
                                                                    ) : m.result === 'bye' ? (
                                                                        <div className="flex flex-col gap-2">
                                                                            <span className="bg-blue-500 text-white px-3 py-1 rounded-full text-sm text-center">BYE</span>
                                                                            <div className="flex items-center gap-2">
                                                                                <span className="text-xs">Puntos:</span>
                                                                                <input
                                                                                    type="number"
                                                                                    min="0"
                                                                                    max="3"
                                                                                    value={m.byePoints}
                                                                                    onChange={(e) => setByePoints(mi, parseInt(e.target.value) || 0)}
                                                                                    className="w-16 px-2 py-1 border-2 border-purple-300 rounded text-center"
                                                                                />
                                                                            </div>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="flex flex-col gap-2">
                                                                            <div className="grid grid-cols-3 gap-1">
                                                                                <button
                                                                                    onClick={() => setResult(mi, 'p1', 1)}
                                                                                    className={'px-2 py-1 rounded text-xs font-semibold ' + (m.result === 'p1' ? 'bg-green-500 text-white' : 'bg-gray-200')}
                                                                                >
                                                                                    J1
                                                                                </button>
                                                                                <button
                                                                                    onClick={() => setResult(mi, 'tie', m.tiePoints || 1)}
                                                                                    className={'px-2 py-1 rounded text-xs font-semibold ' + (m.result === 'tie' ? 'bg-yellow-500 text-white' : 'bg-gray-200')}
                                                                                >
                                                                                    Empate
                                                                                </button>
                                                                                <button
                                                                                    onClick={() => setResult(mi, 'p2', 1)}
                                                                                    className={'px-2 py-1 rounded text-xs font-semibold ' + (m.result === 'p2' ? 'bg-green-500 text-white' : 'bg-gray-200')}
                                                                                >
                                                                                    J2
                                                                                </button>
                                                                            </div>
                                                                            {m.result === 'tie' && (
                                                                                <div className="flex gap-1">
                                                                                    <button
                                                                                        onClick={() => setResult(mi, 'tie', 0)}
                                                                                        className={'flex-1 px-2 py-1 rounded text-xs font-semibold ' + (m.tiePoints === 0 ? 'bg-purple-600 text-white' : 'bg-gray-200')}
                                                                                    >
                                                                                        0pts
                                                                                    </button>
                                                                                    <button
                                                                                        onClick={() => setResult(mi, 'tie', 1)}
                                                                                        className={'flex-1 px-2 py-1 rounded text-xs font-semibold ' + (m.tiePoints === 1 ? 'bg-purple-600 text-white' : 'bg-gray-200')}
                                                                                    >
                                                                                        1pt
                                                                                    </button>
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>

                                                {!activeTournament.rounds[activeTournament.currentRoundIndex].completed && (
                                                    <button
                                                        onClick={completeRound}
                                                        className="w-full mt-6 bg-purple-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-purple-700"
                                                    >
                                                        Completar Ronda {activeTournament.rounds[activeTournament.currentRoundIndex].number}
                                                        <ChevronRight className="w-6 h-6 inline ml-2" />
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'standings' && (
                            <div className="bg-white rounded-lg shadow-xl p-6">
                                <h2 className="text-2xl font-bold text-purple-900 mb-4">Clasificación</h2>
                                {sortedPlayers.length === 0 ? (
                                    <p className="text-center text-gray-500 py-8">No hay jugadores</p>
                                ) : (
                                    <table className="w-full">
                                        <thead>
                                            <tr className="bg-purple-600 text-white">
                                                <th className="px-4 py-3 text-left">#</th>
                                                <th className="px-4 py-3 text-left">Jugador</th>
                                                <th className="px-4 py-3 text-center">V</th>
                                                <th className="px-4 py-3 text-center">D</th>
                                                <th className="px-4 py-3 text-center">E</th>
                                                <th className="px-4 py-3 text-center">Puntos</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {sortedPlayers.map((p, i) => (
                                                <tr key={p.id} className={'border-b ' + (i === 0 ? 'bg-yellow-100' : i === 1 ? 'bg-gray-100' : i === 2 ? 'bg-orange-100' : '')}>
                                                    <td className="px-4 py-3 font-bold">
                                                        {i === 0 && '??'}
                                                        {i === 1 && '??'}
                                                        {i === 2 && '??'}
                                                        {i > 2 && (i + 1)}
                                                    </td>
                                                    <td className="px-4 py-3 font-semibold">{p.name}</td>
                                                    <td className="px-4 py-3 text-center text-green-600 font-bold">{p.wins}</td>
                                                    <td className="px-4 py-3 text-center text-red-600 font-bold">{p.losses}</td>
                                                    <td className="px-4 py-3 text-center text-yellow-600 font-bold">{p.ties}</td>
                                                    <td className="px-4 py-3 text-center">
                                                        <span className="bg-purple-600 text-white px-3 py-1 rounded-full font-bold">
                                                            {p.points}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<YugiohTournament />);
    </script>
</body>
</html>
