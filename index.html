<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#581c87">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Torneos Yu-Gi-Oh!</title>
    <!-- NUEVO: Manifest para PWA -->
    <link rel="manifest" href="./manifest.json">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden;
            background: #f8fafc;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }
        #root {
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* NUEVO: Estilos para modo standalone */
        @media all and (display-mode: standalone) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Plus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
            </svg>
        );

        const X = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
            </svg>
        );

        const ArrowLeft = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
        );

        function TorneosYugioh() {
            const [tournaments, setTournaments] = useState([]);
            const [activeTournamentId, setActiveTournamentId] = useState(null);
            const [view, setView] = useState('list');
            const [newTournamentName, setNewTournamentName] = useState('');
            const [newPlayerName, setNewPlayerName] = useState('');
            const [activeTab, setActiveTab] = useState('clasificacion');

            // NUEVO: Detectar si es PWA
            const [isStandalone, setIsStandalone] = useState(false);

            useEffect(() => {
                // Detectar si la app está instalada como PWA
                if (window.matchMedia('(display-mode: standalone)').matches) {
                    setIsStandalone(true);
                }
                
                const saved = localStorage.getItem('yugioh-tournaments');
                if (saved) {
                    setTournaments(JSON.parse(saved));
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('yugioh-tournaments', JSON.stringify(tournaments));
            }, [tournaments]);

            const activeTournament = tournaments.find(t => t.id === activeTournamentId);

            function createTournament(name) {
                if (!name.trim()) return;
                const newT = {
                    id: Date.now(),
                    name: name.trim(),
                    players: [],
                    rounds: [],
                    currentRoundIndex: -1
                };
                setTournaments([...tournaments, newT]);
                setActiveTournamentId(newT.id);
                setView('tournament');
                setNewTournamentName('');
            }

            function deleteTournament(id) {
                if (!window.confirm('¿Eliminar este torneo?')) return;
                setTournaments(tournaments.filter(t => t.id !== id));
                if (activeTournamentId === id) {
                    setActiveTournamentId(null);
                    setView('list');
                }
            }

            function addPlayer(name) {
                if (!name.trim() || !activeTournament) return;
                const newP = {
                    id: Date.now(),
                    name: name.trim(),
                    points: 0,
                    wins: 0,
                    losses: 0,
                    ties: 0,
                    opponents: []
                };
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { ...t, players: [...t.players, newP] }
                        : t
                );
                setTournaments(updated);
                setNewPlayerName('');
            }

            function deletePlayer(pid) {
                if (!window.confirm('¿Eliminar este jugador?')) return;
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { ...t, players: t.players.filter(p => p.id !== pid) }
                        : t
                );
                setTournaments(updated);
            }

            function generateRound() {
                if (!activeTournament || activeTournament.players.length < 2) {
                    alert('Necesitas al menos 2 jugadores');
                    return;
                }

                const sorted = [...activeTournament.players].sort((a, b) => b.points - a.points);
                const matches = [];
                const used = new Set();

                for (let i = 0; i < sorted.length; i++) {
                    if (used.has(sorted[i].id)) continue;

                    let opp = null;
                    for (let j = i + 1; j < sorted.length; j++) {
                        if (!used.has(sorted[j].id) && !sorted[i].opponents.includes(sorted[j].id)) {
                            opp = sorted[j];
                            break;
                        }
                    }

                    if (!opp) {
                        for (let j = i + 1; j < sorted.length; j++) {
                            if (!used.has(sorted[j].id)) {
                                opp = sorted[j];
                                break;
                            }
                        }
                    }

                    if (opp) {
                        matches.push({
                            id: Date.now() + i,
                            p1: { ...sorted[i] },
                            p2: { ...opp },
                            result: null,
                            tiePoints: 0
                        });
                        used.add(sorted[i].id);
                        used.add(opp.id);
                    } else {
                        matches.push({
                            id: Date.now() + i,
                            p1: { ...sorted[i] },
                            p2: null,
                            result: 'bye',
                            byePoints: 3
                        });
                        used.add(sorted[i].id);
                    }
                }

                const newR = {
                    number: activeTournament.rounds.length + 1,
                    matches: matches,
                    completed: false
                };

                const updated = tournaments.map(t => 
                    t.id === activeTournamentId 
                        ? { 
                            ...t, 
                            rounds: [...t.rounds, newR], 
                            currentRoundIndex: t.rounds.length
                          }
                        : t
                );
                setTournaments(updated);
                setActiveTab('rondas');
            }

            function setResult(mi, res, tiePoints = 0) {
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    const newRounds = [...t.rounds];
                    if (newRounds[t.currentRoundIndex]) {
                        newRounds[t.currentRoundIndex].matches[mi].result = res;
                        if (res === 'tie') {
                            newRounds[t.currentRoundIndex].matches[mi].tiePoints = tiePoints;
                        }
                    }
                    return { ...t, rounds: newRounds };
                });
                setTournaments(updated);
            }

            function setByePoints(mi, pts) {
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    const newRounds = [...t.rounds];
                    if (newRounds[t.currentRoundIndex]) {
                        newRounds[t.currentRoundIndex].matches[mi].byePoints = pts;
                    }
                    return { ...t, rounds: newRounds };
                });
                setTournaments(updated);
            }

            function completeRound() {
                if (!activeTournament) return;
                const round = activeTournament.rounds[activeTournament.currentRoundIndex];
                
                if (!round || !round.matches.every(m => m.result !== null)) {
                    alert('Completa todos los duelos');
                    return;
                }

                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    
                    const newPlayers = [...t.players];
                    round.matches.forEach(m => {
                        if (m.result === 'bye') {
                            const p = newPlayers.find(pl => pl.id === m.p1.id);
                            if (p) {
                                p.points += m.byePoints || 3;
                                p.wins += 1;
                            }
                        } else if (m.p2) {
                            const p1 = newPlayers.find(pl => pl.id === m.p1.id);
                            const p2 = newPlayers.find(pl => pl.id === m.p2.id);
                            
                            if (p1 && p2) {
                                if (!p1.opponents.includes(p2.id)) p1.opponents.push(p2.id);
                                if (!p2.opponents.includes(p1.id)) p2.opponents.push(p1.id);

                                if (m.result === 'p1') {
                                    p1.points += 3;
                                    p1.wins += 1;
                                    p2.losses += 1;
                                } else if (m.result === 'p2') {
                                    p2.points += 3;
                                    p2.wins += 1;
                                    p1.losses += 1;
                                } else if (m.result === 'tie') {
                                    p1.points += m.tiePoints;
                                    p2.points += m.tiePoints;
                                    p1.ties += 1;
                                    p2.ties += 1;
                                }
                            }
                        }
                    });

                    const newRounds = [...t.rounds];
                    if (newRounds[t.currentRoundIndex]) {
                        newRounds[t.currentRoundIndex].completed = true;
                    }

                    return { ...t, players: newPlayers, rounds: newRounds };
                });
                setTournaments(updated);
            }

            function deleteRound(ri) {
                if (!window.confirm('¿Eliminar esta ronda?')) return;
                const updated = tournaments.map(t => {
                    if (t.id !== activeTournamentId) return t;
                    
                    const roundToDelete = t.rounds[ri];
                    if (roundToDelete.completed) {
                        const newPlayers = [...t.players];
                        roundToDelete.matches.forEach(m => {
                            if (m.result === 'bye') {
                                const p = newPlayers.find(pl => pl.id === m.p1.id);
                                if (p) {
                                    p.points -= m.byePoints || 3;
                                    p.wins -= 1;
                                }
                            } else if (m.p2) {
                                const p1 = newPlayers.find(pl => pl.id === m.p1.id);
                                const p2 = newPlayers.find(pl => pl.id === m.p2.id);
                                
                                if (p1 && p2) {
                                    p1.opponents = p1.opponents.filter(id => id !== p2.id);
                                    p2.opponents = p2.opponents.filter(id => id !== p1.id);

                                    if (m.result === 'p1') {
                                        p1.points -= 3;
                                        p1.wins -= 1;
                                        p2.losses -= 1;
                                    } else if (m.result === 'p2') {
                                        p2.points -= 3;
                                        p2.wins -= 1;
                                        p1.losses -= 1;
                                    } else if (m.result === 'tie') {
                                        p1.points -= m.tiePoints;
                                        p2.points -= m.tiePoints;
                                        p1.ties -= 1;
                                        p2.ties -= 1;
                                    }
                                }
                            }
                        });
                    }

                    const newRounds = t.rounds.filter((r, i) => i !== ri);
                    let newCurrentRoundIndex = t.currentRoundIndex;
                    
                    if (ri === t.currentRoundIndex) {
                        newCurrentRoundIndex = newRounds.length > 0 ? newRounds.length - 1 : -1;
                    } else if (ri < t.currentRoundIndex) {
                        newCurrentRoundIndex = t.currentRoundIndex - 1;
                    }

                    return { 
                        ...t, 
                        players: roundToDelete.completed ? newPlayers : t.players,
                        rounds: newRounds, 
                        currentRoundIndex: newCurrentRoundIndex 
                    };
                });
                setTournaments(updated);
            }

            function changeRound(i) {
                const updated = tournaments.map(t => 
                    t.id === activeTournamentId ? { ...t, currentRoundIndex: i } : t
                );
                setTournaments(updated);
            }

            const sortedPlayers = activeTournament ? [...activeTournament.players].sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                if (b.wins !== a.wins) return b.wins - a.wins;
                return a.losses - b.losses;
            }) : [];

            // Vista principal - Lista de torneos
            if (view === 'list') {
                return (
                    <div className="min-h-screen bg-gray-50 p-4">
                        <div className="max-w-2xl mx-auto">
                            {/* Header */}
                            <div className="mb-8">
                                <h1 className="text-2xl font-bold text-gray-900 text-center mb-2">
                                    Torneos Yu-Gi-Oh!
                                </h1>
                                {/* NUEVO: Indicador de app instalada */}
                                {isStandalone && (
                                    <p className="text-green-600 text-sm text-center">✓ Aplicación instalada</p>
                                )}
                            </div>

                            {/* Sección Mis Torneos */}
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
                                <h2 className="text-lg font-bold text-gray-900 mb-4">
                                    Mis Torneos
                                </h2>

                                {/* Input para nuevo torneo */}
                                <div className="flex gap-2 mb-4">
                                    <input
                                        type="text"
                                        placeholder="Nombre del torneo"
                                        value={newTournamentName}
                                        onChange={(e) => setNewTournamentName(e.target.value)}
                                        className="flex-1 px-3 py-2 border border-gray-300 rounded text-sm"
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter') {
                                                createTournament(newTournamentName);
                                            }
                                        }}
                                    />
                                    <button
                                        onClick={() => createTournament(newTournamentName)}
                                        className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 flex items-center gap-1 text-sm"
                                    >
                                        <Plus className="w-4 h-4" />
                                    </button>
                                </div>

                                {/* Lista de torneos */}
                                {tournaments.length === 0 ? (
                                    <div className="text-center py-8">
                                        <p className="text-gray-500 text-sm">No hay torneos</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {tournaments.map(t => (
                                            <div key={t.id} className="flex justify-between items-center p-3 bg-gray-50 rounded border border-gray-200">
                                                <span className="font-medium text-gray-900 text-sm">{t.name}</span>
                                                <div className="flex gap-2">
                                                    <button
                                                        onClick={() => {
                                                            setActiveTournamentId(t.id);
                                                            setView('tournament');
                                                        }}
                                                        className="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700"
                                                    >
                                                        Abrir
                                                    </button>
                                                    <button
                                                        onClick={() => deleteTournament(t.id)}
                                                        className="bg-red-600 text-white px-2 py-1 rounded text-xs hover:bg-red-700"
                                                    >
                                                        <X className="w-3 h-3" />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // Vista de torneo individual
            if (view === 'tournament' && activeTournament) {
                const currentRound = activeTournament.currentRoundIndex >= 0 
                    ? activeTournament.rounds[activeTournament.currentRoundIndex] 
                    : null;

                return (
                    <div className="min-h-screen bg-gray-50 p-4">
                        <div className="max-w-4xl mx-auto">
                            {/* Botón Atrás */}
                            <button
                                onClick={() => setView('list')}
                                className="flex items-center gap-2 text-gray-600 mb-4 hover:bg-white px-3 py-2 rounded text-sm"
                            >
                                <ArrowLeft className="w-4 h-4" />
                                Atrás
                            </button>

                            {/* Header del Torneo */}
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4">
                                <h1 className="text-xl font-bold text-gray-900 text-center">
                                    {activeTournament.name}
                                </h1>
                            </div>

                            {/* Pestañas */}
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 mb-4">
                                <div className="flex border-b border-gray-200">
                                    <button
                                        onClick={() => setActiveTab('clasificacion')}
                                        className={`flex-1 py-3 text-sm font-medium ${
                                            activeTab === 'clasificacion'
                                                ? 'text-blue-600 border-b-2 border-blue-600'
                                                : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        Clasificación
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('jugadores')}
                                        className={`flex-1 py-3 text-sm font-medium ${
                                            activeTab === 'jugadores'
                                                ? 'text-blue-600 border-b-2 border-blue-600'
                                                : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        Jugadores
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('rondas')}
                                        className={`flex-1 py-3 text-sm font-medium ${
                                            activeTab === 'rondas'
                                                ? 'text-blue-600 border-b-2 border-blue-600'
                                                : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        Rondas
                                    </button>
                                </div>

                                {/* Contenido de las pestañas */}
                                <div className="p-4">
                                    {/* Pestaña Clasificación */}
                                    {activeTab === 'clasificacion' && (
                                        <div>
                                            <h2 className="text-lg font-bold text-gray-900 mb-4">Clasificación</h2>
                                            {sortedPlayers.length === 0 ? (
                                                <p className="text-gray-500 text-center py-8">No hay jugadores</p>
                                            ) : (
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-sm">
                                                        <thead>
                                                            <tr className="border-b border-gray-200">
                                                                <th className="text-left py-2 font-semibold text-gray-900">#</th>
                                                                <th className="text-left py-2 font-semibold text-gray-900">Jugador</th>
                                                                <th className="text-center py-2 font-semibold text-gray-900">Puntos</th>
                                                                <th className="text-center py-2 font-semibold text-gray-900">W</th>
                                                                <th className="text-center py-2 font-semibold text-gray-900">L</th>
                                                                <th className="text-center py-2 font-semibold text-gray-900">T</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {sortedPlayers.map((p, i) => (
                                                                <tr key={p.id} className="border-b border-gray-100">
                                                                    <td className="py-3 font-semibold text-gray-900">{i + 1}</td>
                                                                    <td className="py-3 font-medium text-gray-900">{p.name}</td>
                                                                    <td className="py-3 text-center font-semibold text-gray-900">{p.points}</td>
                                                                    <td className="py-3 text-center text-gray-600">{p.wins}</td>
                                                                    <td className="py-3 text-center text-gray-600">{p.losses}</td>
                                                                    <td className="py-3 text-center text-gray-600">{p.ties}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Pestaña Jugadores */}
                                    {activeTab === 'jugadores' && (
                                        <div>
                                            <h2 className="text-lg font-bold text-gray-900 mb-4">Jugadores</h2>
                                            
                                            {/* Input para añadir jugador */}
                                            <div className="flex gap-2 mb-4">
                                                <input
                                                    type="text"
                                                    placeholder="Nombre del jugador"
                                                    value={newPlayerName}
                                                    onChange={(e) => setNewPlayerName(e.target.value)}
                                                    className="flex-1 px-3 py-2 border border-gray-300 rounded text-sm"
                                                    onKeyPress={(e) => {
                                                        if (e.key === 'Enter') {
                                                            addPlayer(newPlayerName);
                                                        }
                                                    }}
                                                />
                                                <button
                                                    onClick={() => addPlayer(newPlayerName)}
                                                    className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm"
                                                >
                                                    <Plus className="w-4 h-4" />
                                                </button>
                                            </div>

                                            {/* Lista de jugadores */}
                                            {activeTournament.players.length === 0 ? (
                                                <p className="text-gray-500 text-center py-8">No hay jugadores</p>
                                            ) : (
                                                <div className="space-y-2">
                                                    {activeTournament.players.map((p) => (
                                                        <div key={p.id} className="flex justify-between items-center p-3 bg-gray-50 rounded border border-gray-200">
                                                            <div>
                                                                <p className="font-medium text-gray-900">{p.name}</p>
                                                                <p className="text-xs text-gray-600">{p.points} puntos</p>
                                                            </div>
                                                            <button
                                                                onClick={() => deletePlayer(p.id)}
                                                                className="bg-red-600 text-white px-2 py-1 rounded text-xs hover:bg-red-700"
                                                            >
                                                                <X className="w-3 h-3" />
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Pestaña Rondas */}
                                    {activeTab === 'rondas' && (
                                        <div>
                                            <div className="flex justify-between items-center mb-4">
                                                <h2 className="text-lg font-bold text-gray-900">Rondas</h2>
                                                {activeTournament.players.length >= 2 && (
                                                    <button
                                                        onClick={generateRound}
                                                        className="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700"
                                                    >
                                                        Generar Ronda {activeTournament.rounds.length + 1}
                                                    </button>
                                                )}
                                            </div>

                                            {activeTournament.rounds.length === 0 ? (
                                                <p className="text-gray-500 text-center py-8">No hay rondas generadas</p>
                                            ) : (
                                                <div className="space-y-4">
                                                    {/* Selector de rondas */}
                                                    <div className="flex gap-2 overflow-x-auto pb-2">
                                                        {activeTournament.rounds.map((r, i) => (
                                                            <button
                                                                key={i}
                                                                onClick={() => changeRound(i)}
                                                                className={`px-3 py-2 rounded text-sm font-medium whitespace-nowrap ${
                                                                    i === activeTournament.currentRoundIndex
                                                                        ? 'bg-blue-600 text-white'
                                                                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                }`}
                                                            >
                                                                Ronda {r.number} {r.completed && '✓'}
                                                            </button>
                                                        ))}
                                                    </div>

                                                    {/* Tabla de la ronda actual */}
                                                    {currentRound && (
                                                        <div>
                                                            <div className="flex justify-between items-center mb-3">
                                                                <h3 className="text-md font-bold text-gray-900">Ronda {currentRound.number}</h3>
                                                                <button
                                                                    onClick={() => deleteRound(activeTournament.currentRoundIndex)}
                                                                    className="bg-red-600 text-white px-3 py-1 rounded text-xs hover:bg-red-700 flex items-center gap-1"
                                                                >
                                                                    <X className="w-3 h-3" />
                                                                    Eliminar Ronda
                                                                </button>
                                                            </div>
                                                            
                                                            <div className="overflow-x-auto">
                                                                <table className="w-full text-sm">
                                                                    <thead>
                                                                        <tr className="border-b border-gray-200">
                                                                            <th className="text-left py-2 font-semibold text-gray-900">Mesa</th>
                                                                            <th className="text-left py-2 font-semibold text-gray-900">Jugador 1</th>
                                                                            <th className="text-center py-2 font-semibold text-gray-900">VS</th>
                                                                            <th className="text-left py-2 font-semibold text-gray-900">Jugador 2</th>
                                                                            <th className="text-center py-2 font-semibold text-gray-900">Resultado</th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody>
                                                                        {currentRound.matches.map((m, mi) => (
                                                                            <tr key={m.id} className="border-b border-gray-100">
                                                                                <td className="py-3 font-semibold text-gray-900">#{mi + 1}</td>
                                                                                <td className="py-3">
                                                                                    <span className="font-medium text-gray-900">{m.p1.name}</span>
                                                                                    <span className="text-xs text-gray-600 block">{m.p1.points}pts</span>
                                                                                </td>
                                                                                <td className="py-3 text-center text-gray-400">VS</td>
                                                                                <td className="py-3">
                                                                                    {m.p2 ? (
                                                                                        <>
                                                                                            <span className="font-medium text-gray-900">{m.p2.name}</span>
                                                                                            <span className="text-xs text-gray-600 block">{m.p2.points}pts</span>
                                                                                        </>
                                                                                    ) : (
                                                                                        <span className="text-gray-500">BYE</span>
                                                                                    )}
                                                                                </td>
                                                                                <td className="py-3">
                                                                                    {m.p2 ? (
                                                                                        <div className="flex flex-col gap-2 items-center">
                                                                                            <div className="flex gap-1">
                                                                                                <button
                                                                                                    onClick={() => setResult(mi, 'p1')}
                                                                                                    className={`px-3 py-1 rounded text-xs font-medium ${
                                                                                                        m.result === 'p1'
                                                                                                            ? 'bg-green-600 text-white'
                                                                                                            : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                                                    }`}
                                                                                                >
                                                                                                    J1
                                                                                                </button>
                                                                                                <button
                                                                                                    onClick={() => setResult(mi, 'tie', 0)}
                                                                                                    className={`px-3 py-1 rounded text-xs font-medium ${
                                                                                                        m.result === 'tie'
                                                                                                            ? 'bg-blue-600 text-white'
                                                                                                            : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                                                    }`}
                                                                                                >
                                                                                                    Emp
                                                                                                </button>
                                                                                                <button
                                                                                                    onClick={() => setResult(mi, 'p2')}
                                                                                                    className={`px-3 py-1 rounded text-xs font-medium ${
                                                                                                        m.result === 'p2'
                                                                                                            ? 'bg-green-600 text-white'
                                                                                                            : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                                                    }`}
                                                                                                >
                                                                                                    J2
                                                                                                </button>
                                                                                            </div>
                                                                                            {m.result === 'tie' && (
                                                                                                <div className="flex gap-1 items-center">
                                                                                                    <span className="text-xs text-gray-600">Puntos empate:</span>
                                                                                                    <div className="flex gap-1">
                                                                                                        {[0, 1].map(points => (
                                                                                                            <button
                                                                                                                key={points}
                                                                                                                onClick={() => setResult(mi, 'tie', points)}
                                                                                                                className={`w-6 h-6 rounded text-xs ${
                                                                                                                    m.tiePoints === points
                                                                                                                        ? 'bg-blue-600 text-white'
                                                                                                                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                                                                }`}
                                                                                                            >
                                                                                                                {points}
                                                                                                            </button>
                                                                                                        ))}
                                                                                                    </div>
                                                                                                </div>
                                                                                            )}
                                                                                        </div>
                                                                                    ) : (
                                                                                        <div className="flex flex-col gap-2 items-center">
                                                                                            <span className="text-xs text-gray-600">Puntos BYE:</span>
                                                                                            <div className="flex gap-1">
                                                                                                {[0, 1, 2, 3].map(points => (
                                                                                                    <button
                                                                                                        key={points}
                                                                                                        onClick={() => setByePoints(mi, points)}
                                                                                                        className={`w-8 h-8 rounded text-xs font-medium ${
                                                                                                            m.byePoints === points
                                                                                                                ? 'bg-blue-600 text-white'
                                                                                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                                                                        }`}
                                                                                                    >
                                                                                                        {points}
                                                                                                    </button>
                                                                                                ))}
                                                                                            </div>
                                                                                        </div>
                                                                                    )}
                                                                                </td>
                                                                            </tr>
                                                                        ))}
                                                                    </tbody>
                                                                </table>
                                                            </div>

                                                            {!currentRound.completed && (
                                                                <button
                                                                    onClick={completeRound}
                                                                    className="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700 mt-4 text-sm"
                                                                >
                                                                    Completar Ronda {currentRound.number}
                                                                </button>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return <div className="text-gray-900 p-4 text-center">Cargando...</div>;
        }

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<TorneosYugioh />);
        } catch (error) {
            console.error('Error:', error);
        }
    </script>

    <!-- NUEVO: Scripts mejorados para PWA -->
    <script>
        // Service Worker para funcionamiento offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(registration) {
                        console.log('✅ ServiceWorker registrado correctamente para funcionamiento offline');
                    })
                    .catch(function(error) {
                        console.log('❌ Error en ServiceWorker:', error);
                    });
            });
        }

        // Prevenir comportamientos no deseados en móviles
        document.addEventListener('touchmove', function(e) {
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // Manejar estado online/offline
        window.addEventListener('online', function() {
            console.log('📶 Aplicación conectada');
        });

        window.addEventListener('offline', function() {
            console.log('📵 Aplicación funcionando offline - Los datos se guardan localmente');
        });

        // Prevenir que la app se cierre accidentalmente
        window.addEventListener('beforeunload', function(e) {
            if (localStorage.getItem('yugioh-tournaments')) {
                e.returnValue = '¿Estás seguro de que quieres salir? Tus datos están guardados localmente.';
            }
        });
    </script>
</body>
</html>
